name: Build TargetGame

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT=$(find project -name build.gradle -o -name build.gradle.kts | head -n 1)
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TargetGame-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
